<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f9f8f8" />
<title>DeepSeek | 让我帮你问一下</title>
<link rel="icon" href="https://www.deepseek.com/favicon.ico" />
<style>
  :root {
    --color-primary: #306eff;
    --color-primary-hover: #4a80ff;
    --color-primary-active: #175cff;
    --send-bg: #4176e6;
    --bg-page: #f9f8f8;
    --text-primary: #1e232c;
    --text-secondary: rgba(0,0,0,.7);
    --text-placeholder: #8691a1;
    --font-sans: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", sans-serif;
    --radius-input: 10px;
    --radius-card: 24px;
    --radius-pill: 100px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(rgb(156, 193, 231) 0%, rgba(250, 250, 250, 0) 100%);
  }

  /* 顶部导航 */
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    max-width: 1100px; margin: 0 auto; padding: 20px 24px;
  }
  .nav .brand { display: flex; align-items: center; gap: 8px; }
  .nav .brand img { height: 28px; width: 28px; }
  .nav .brand span { font-weight: 700; font-size: 18px; letter-spacing: -.3px; }

  /* hero */
  .hero { text-align: center; padding: 13vh 24px 0; }

  .search-wrap { max-width: 880px; margin: 0 auto; position: relative; }
  .search-card {
    width: 100%; border-radius: var(--radius-card);
    border: 2px solid rgba(255, 255, 255, .8);
    background: rgba(255, 255, 255, .2);
    backdrop-filter: blur(12px);
    padding: 8px 10px 8px 18px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 12px 40px rgba(30, 35, 44, .08);
  }
  .search-card input {
    flex: 1; border: none; outline: none; background: transparent;
    font-family: inherit; font-size: 18px; color: var(--text-primary);
    height: 60px; min-width: 0;
  }
  .search-card input::placeholder { color: var(--text-placeholder); }
  .send-btn {
    width: 42px; height: 42px; border-radius: 50%; border: none; flex: none;
    background: var(--send-bg); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, transform .15s;
  }
  .send-btn:hover { background: var(--color-primary-hover); }
  .send-btn:disabled { cursor: default; }
  .send-btn.pressed { background: var(--color-primary-active); transform: scale(.9); }
  .send-btn svg { width: 18px; height: 18px; }

  .search-tags { display: flex; gap: 10px; margin-top: 16px; justify-content: center; }
  .tag {
    padding: 6px 14px; border-radius: var(--radius-pill);
    border: 1px solid rgba(0, 0, 0, .08); background: rgba(255, 255, 255, .4);
    color: var(--text-secondary); font-size: 13px; cursor: pointer;
    font-family: inherit; transition: all .15s;
  }
  .tag.active {
    border-color: var(--color-primary); color: var(--color-primary);
    background: rgba(48, 110, 255, .08);
  }

  #tips { text-align: center; margin-top: 18px; color: var(--text-secondary); font-size: 15px; min-height: 24px; }

  /* 生成链接输出区 */
  #output {
    display: none; max-width: 880px; margin: 30px auto 0; text-align: center; padding: 0 24px;
  }
  #output .hint { color: var(--text-secondary); font-size: 15px; margin-bottom: 12px; }
  #output input {
    width: 100%; padding: 12px 16px; border-radius: var(--radius-input);
    border: 1px solid rgba(0, 0, 0, .1); background: rgba(255, 255, 255, .5);
    font-size: 14px; color: var(--text-primary); text-align: center; outline: none;
  }
  .tool-btns { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  .tool-btns button {
    padding: 8px 22px; border-radius: var(--radius-pill);
    border: 1px solid rgba(0, 0, 0, .12); background: #fff;
    color: var(--text-primary); cursor: pointer; font-size: 14px; transition: all .15s;
  }
  .tool-btns button:hover { border-color: var(--color-primary); color: var(--color-primary); }

  /* 箭头光标 */
  #arrow {
    position: fixed; left: 0; top: 0; width: 44px; height: 44px;
    pointer-events: none; display: none; z-index: 100;
    transition: left .6s cubic-bezier(.22,.61,.36,1), top .6s cubic-bezier(.22,.61,.36,1);
  }
  #arrow svg {
    width: 44px; height: 44px;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.28));
    animation: arrow-pulse 1.1s ease-in-out infinite;
  }
  @keyframes arrow-pulse { 0%,100% { transform: translateY(0); } 50% { transform: translateY(7px); } }

  @media (max-width: 720px) {
    .hero { padding-top: 9vh; }
    .search-card input { font-size: 16px; }
  }
</style>
</head>
<body>
  <nav class="nav">
    <div class="brand">
      <img src="https://www.deepseek.com/favicon.ico" alt="deepseek" />
      <span>deepseek</span>
    </div>
  </nav>

  <section class="hero">
    <div class="search-wrap">
      <div class="search-card">
        <input id="kw" type="text" maxlength="255" autocomplete="off" placeholder="问点什么，一起探索" />
        <button class="send-btn" id="send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="search-tags">
        <button type="button" class="tag" id="tagThink">深度思考</button>
        <button type="button" class="tag" id="tagSearch">智能搜索</button>
      </div>
    </div>
    <p id="tips">输入一个问题，然后点发送</p>
  </section>

  <section id="output">
    <p class="hint">↓↓↓ 复制下面的链接，教伸手党使用 DeepSeek</p>
    <input id="url-output" type="text" readonly />
    <div class="tool-btns">
      <button id="copy">复制</button>
      <button id="preview">预览</button>
    </div>
  </section>

  <div id="arrow">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M12 3v14" stroke="#306eff" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M6 12l6 6 6-6" stroke="#306eff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <script>
  (function () {
    var $ = function (s) { return document.querySelector(s); };
    var input = $('#kw');
    var sendBtn = $('#send');
    var tips = $('#tips');
    var arrow = $('#arrow');
    var output = $('#output');
    var urlOutput = $('#url-output');
    var tagThink = $('#tagThink');
    var tagSearch = $('#tagSearch');
    var playing = false;
    var thinkOn = false;
    var searchOn = false;

    var query = '';
    try {
      var sp = new URLSearchParams(location.search);
      query = sp.get('q') || '';
      if (sp.get('think') === '1') { thinkOn = true; tagThink.classList.add('active'); }
      if (sp.get('search') === '1') { searchOn = true; tagSearch.classList.add('active'); }
    } catch (e) {}
    if (query) { try { query = decodeURIComponent(query); } catch (e) {} }

    function buildParams(q) {
      var p = new URLSearchParams();
      p.set('q', q);
      if (thinkOn) p.set('think', '1');
      if (searchOn) p.set('search', '1');
      return p.toString();
    }
    function linkFor(q) {
      return location.href.split('#')[0].split('?')[0] + '?' + buildParams(q);
    }

    function moveArrow(el, done) {
      arrow.style.display = 'block';
      var r = el.getBoundingClientRect();
      arrow.style.left = (r.left + r.width / 2 - arrow.offsetWidth / 2) + 'px';
      arrow.style.top = (r.top + r.height / 2 - arrow.offsetHeight / 2) + 'px';
      if (done) setTimeout(done, 650);
    }

    // 整蛊教程动画：字缓慢输入 -> 箭头点向发送 -> 跳转聊天界面
    function playTutorial(q) {
      playing = true;
      sendBtn.disabled = true;
      tips.textContent = '让我来教你正确的打开方式';
      setTimeout(function () {
        moveArrow(input, function () {
          tips.textContent = '1、找到输入框，输入你的问题';
          var i = 0;
          var t = setInterval(function () {
            input.value = q.slice(0, i + 1);
            i++;
            if (i >= q.length) {
              clearInterval(t);
              moveArrow(sendBtn, function () {
                tips.textContent = '2、点击「发送」按钮';
                sendBtn.classList.add('pressed');
                setTimeout(function () {
                  location.href = 'chat.html?' + buildParams(q);
                }, 700);
              });
            }
          }, 120);
        });
      }, 800);
    }

    // 生成链接（无 ?q= 时）
    function submit() {
      if (playing) return;
      var q = input.value.trim();
      if (!q) { tips.textContent = '搜了个寂寞？'; return; }
      tips.textContent = '↓↓↓ 复制下面的链接，教伸手党使用 DeepSeek';
      output.style.display = 'block';
      urlOutput.value = linkFor(q);
      urlOutput.focus(); urlOutput.select();
    }

    tagThink.addEventListener('click', function () {
      thinkOn = !thinkOn;
      tagThink.classList.toggle('active', thinkOn);
    });
    tagSearch.addEventListener('click', function () {
      searchOn = !searchOn;
      tagSearch.classList.toggle('active', searchOn);
    });

    sendBtn.addEventListener('click', submit);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    });

    $('#copy').addEventListener('click', function () {
      navigator.clipboard.writeText(urlOutput.value)
        .then(function () { tips.textContent = '复制成功！赶紧把链接甩给伸手党们！'; })
        .catch(function () { tips.textContent = '复制失败，请手动复制。'; });
    });
    $('#preview').addEventListener('click', function () {
      if (urlOutput.value) window.open(urlOutput.value);
    });

    if (query) playTutorial(query);
    else input.focus();
  })();
  </script>
</body>
</html>
