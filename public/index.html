<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DeepSeek | 深度求索</title>
<meta name="description" content="深度求索（DeepSeek），探索未至之境。专注于研究世界领先的通用人工智能底层模型与技术，开源 DeepSeek-V4、DeepSeek-R1 等前沿大模型。和 DeepSeek AI 对话，轻松接入 API。" />
<link rel="icon" href="https://www.deepseek.com/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    /* ---------- DeepSeek 设计令牌（提取自 www.deepseek.com） ---------- */
    --ds-color-text-primary: #1e232c;
    --ds-color-text-primary-bluish: #152443;
    --ds-color-text-link-blue: #234792;
    --ds-color-text-secondary: rgba(0,0,0,.7);
    --ds-color-text-description: rgba(0,0,0,.65);
    --ds-color-text-inverse: #fff;
    --ds-color-text-placeholder: #8691a1;
    --ds-color-brand: #4d6bfe;
    --ds-color-brand-deep: #3a65c2;
    --ds-color-brand-medium-reverse: #4176e6;
    --ds-color-brand-light-reverse: #73a3d2;
    --ds-color-bg-page: #f9f8f8;
    --ds-color-bg-surface-1: hsla(0,0%,100%,.3);
    --ds-color-bg-surface-2: hsla(0,0%,100%,.2);
    --ds-color-bg-input: hsla(0,0%,100%,.2);
    --ds-color-bg-input-hover: hsla(0,0%,100%,.36);
    --ds-color-bg-hover: rgba(0,0,0,.04);
    --ds-color-bg-surface-raised: hsla(0,0%,100%,.45);
    --ds-color-border-subtle: rgba(0,0,0,.06);
    --ds-color-border-default: rgba(0,0,0,.1);
    --ds-color-border-divider: rgba(0,0,0,.08);
    --ds-color-border-input-focus: hsla(0,0%,100%,.25);
    --ds-color-scrollbar: rgba(0,0,0,.15);

    --ds-btn-secondary-bg: hsla(0,0%,100%,.4);
    --ds-btn-secondary-text: #1e232c;
    --ds-btn-secondary-border: rgba(9,45,78,.18);
    --ds-btn-secondary-hover-bg: rgba(0,0,0,.05);
    --ds-btn-secondary-hover-border: rgba(9,45,78,.36);
    --ds-btn-ghost-text: #121c31;
    --ds-btn-ghost-border: rgba(0,0,0,.2);
    --ds-btn-ghost-hover-bg: rgba(0,0,0,.05);
    --ds-btn-ghost-hover-border: rgba(9,45,78,.3);

    --ds-radius-pill: 100px;
    --ds-radius-card: 24px;
    --ds-radius-panel: 16px;
    --ds-radius-input: 10px;
    --ds-radius-sm: 8px;
    --ds-space-1: 4px; --ds-space-2: 8px; --ds-space-3: 12px;
    --ds-space-4: 16px; --ds-space-5: 24px; --ds-space-6: 32px;
    --ds-space-7: 40px; --ds-space-8: 56px;
    --ds-blur-glass: 12px;
    --ds-font-body: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ds-color-bg-page);
    color: var(--ds-color-text-primary);
    font-family: var(--ds-font-body);
    font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; color: inherit; }

  .hidden { display: none !important; }

  /* ==================== 顶栏 ==================== */
  .header-wrapper {
    position: fixed; top: 0; left: 0; right: 0; margin: 0 auto; z-index: 50;
    width: min(100% - 48px, 1140px);
    padding: var(--ds-space-2) 0 0;
  }
  .header-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin: 0 auto; padding: 4px 12px; border-radius: var(--ds-radius-pill);
    border: 1px solid transparent; background: transparent;
    transition: background-color .3s ease, border-color .3s ease, backdrop-filter .3s ease;
  }
  .header-bar.is-scrolled {
    background: var(--ds-color-bg-surface-raised);
    backdrop-filter: blur(var(--ds-blur-glass)); -webkit-backdrop-filter: blur(var(--ds-blur-glass));
    border-color: var(--ds-color-border-default);
  }
  .brand { display: flex; align-items: center; flex-shrink: 0; color: var(--ds-color-brand-medium-reverse); }
  .brand svg { display: block; height: 23px; width: auto; }

  .header-right { display: flex; align-items: center; gap: 12px; }

  /* 通用按钮基础 */
  .btn {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    gap: var(--ds-space-2); border-radius: var(--ds-radius-pill); box-sizing: border-box;
    font-family: var(--ds-font-body); font-weight: 500; line-height: 120%;
    text-decoration: none; cursor: pointer; overflow: hidden; isolation: isolate;
  }
  .btn::after {
    content: ""; position: absolute; top: 50%; left: 50%; width: 150%; aspect-ratio: 1;
    border-radius: 50%; opacity: 0; z-index: -1; transform: translate(-50%,-50%) scale(0);
    transition: transform .36s ease-out, opacity .1s ease;
  }
  .btn:hover::after { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  .btn svg { width: 16px; height: 16px; }
  .btn-ghost {
    background: transparent; color: var(--ds-btn-ghost-text);
    border: 1px solid var(--ds-btn-ghost-border); font-weight: 400; transition: border-color .2s;
  }
  .btn-ghost::after { background: var(--ds-btn-ghost-hover-bg); }
  .btn-ghost:hover { border-color: var(--ds-btn-ghost-hover-border); }
  .btn-nav { font-size: 15px; padding: 8px 12px; }
  .btn-secondary {
    background: var(--ds-btn-secondary-bg); color: var(--ds-btn-secondary-text);
    border: 1px solid var(--ds-btn-secondary-border); font-weight: 500;
    backdrop-filter: blur(var(--ds-blur-glass)); -webkit-backdrop-filter: blur(var(--ds-blur-glass));
    transition: border-color .35s ease; padding: 12px 20px;
  }
  .btn-secondary::after { background: var(--ds-btn-secondary-hover-bg); }
  .btn-secondary:hover { border-color: var(--ds-btn-secondary-hover-border); }
  .btn-m { font-size: 15px; padding: 12px 20px; }

  /* 获取APP二维码 */
  .qr-trigger { position: relative; }
  .qr-menu { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); z-index: 60; }
  .qr-panel {
    width: 180px; padding: 12px; margin-top: 12px; display: flex; flex-direction: column;
    align-items: center; gap: 8px; background: var(--ds-color-bg-surface-1);
    border: 1px solid var(--ds-color-border-subtle); border-radius: var(--ds-radius-panel);
    backdrop-filter: blur(var(--ds-blur-glass)); -webkit-backdrop-filter: blur(var(--ds-blur-glass));
    box-shadow: 0 12px 32px rgba(0,0,0,.12);
    opacity: 0; transform: translateY(-4px); pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .qr-trigger:hover .qr-panel { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .qr-panel img { width: 100%; aspect-ratio: 1; border-radius: 12px; display: block; }
  .qr-panel span { font-size: 13px; color: var(--ds-color-text-secondary); text-align: center; }

  /* 语言切换 */
  .locale-toggle {
    display: flex; align-items: center; height: 32px; padding: 3px;
    border-radius: var(--ds-radius-pill); border: 1px solid var(--ds-color-border-default);
  }
  .locale-toggle button {
    display: flex; align-items: center; justify-content: center; height: 100%;
    padding: 0 12px; border: none; background: transparent; border-radius: var(--ds-radius-pill);
    font-size: 12px; font-weight: 500; font-family: inherit; cursor: pointer;
    color: var(--ds-color-text-description); transition: color .2s, background-color .2s, box-shadow .2s;
  }
  .locale-toggle button.is-active {
    background: var(--ds-color-bg-surface-raised); color: var(--ds-color-text-primary);
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  /* ==================== 主区 / Hero ==================== */
  main { display: flex; flex-direction: column; width: 100%; }
  .hero {
    position: relative; display: flex; flex-direction: column; align-items: center;
    justify-content: center; overflow: hidden; width: 100%;
    min-height: min(100vh, 1020px); min-height: min(100svh, 1020px);
    background: linear-gradient(180deg, #9cc1e7 0%, rgba(250, 250, 250, 0) 100%);
  }
  .hero-inner {
    position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 1080px; padding: 64px 24px 0; gap: 40px;
  }
  .hero-top { display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }

  .announce {
    display: inline-flex; align-items: center; gap: 6px; max-width: 560px;
    font-family: var(--ds-font-body); font-size: 15px; font-weight: 400; line-height: 160%;
    color: var(--ds-color-text-primary); transition: color .25s;
  }
  .announce:hover { color: var(--ds-color-text-primary-bluish); }
  .announce .spark { width: 14px; height: 14px; flex-shrink: 0; }
  .announce .txt { opacity: .55; transition: opacity .2s; }
  .announce:hover .txt { opacity: 1; }
  .announce .arr { opacity: .55; transition: opacity .2s, transform .2s; flex-shrink: 0; }
  .announce:hover .arr { opacity: 1; transform: translateX(2px); }
  .announce .arr svg { width: 16px; height: 16px; display: block; }

  .slogan {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 38px; font-weight: 400; line-height: 155%;
    letter-spacing: .2em; color: var(--ds-color-text-primary-bluish);
    opacity: .92; margin: 0;
  }

  .hero-search { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 880px; gap: 40px; }

  /* 输入卡片 */
  .input-card {
    display: flex; flex-direction: column; gap: 4px; width: 100%;
    padding: 4px 10px 10px; border: 2px solid hsla(0,0%,100%,.8);
    background: var(--ds-color-bg-input); border-radius: var(--ds-radius-card);
    backdrop-filter: blur(var(--ds-blur-glass)); -webkit-backdrop-filter: blur(var(--ds-blur-glass));
    cursor: text; transition: background-color .2s ease, border-color .2s ease;
  }
  .input-card:focus-within, .input-card:hover {
    background-color: var(--ds-color-bg-input-hover); border-color: var(--ds-color-border-input-focus);
  }
  .input-card textarea {
    width: 100%; min-height: 80px; max-height: 300px; background: transparent; border: none;
    outline: none; resize: none; font-family: var(--ds-font-body); font-size: 16px; font-weight: 400;
    line-height: 1.4em; color: var(--ds-color-text-primary); padding: 12px;
    overflow-y: auto; scrollbar-width: thin;
  }
  .input-card textarea::placeholder { color: rgba(45,55,72,.7); opacity: 1; }
  .input-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .toggles { display: flex; align-items: center; gap: 8px; }

  .toggle {
    display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 12px;
    border-radius: 18px; font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer;
    border: 1px solid var(--ds-color-border-default); background: transparent;
    color: var(--ds-color-text-primary); transition: border .2s, background .2s, color .2s;
  }
  .toggle svg { width: 14px; height: 14px; }
  .toggle .lbl { display: none; }
  .toggle:hover { background-color: var(--ds-color-bg-hover); }
  .toggle.selected {
    background-color: rgba(65,118,230,.12); color: var(--ds-color-brand-medium-reverse);
    border-color: rgba(65,118,230,.3);
  }
  .toggle.selected:hover { background-color: rgba(65,118,230,.18); }

  .send-btn {
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 50%; border: none; overflow: hidden;
    background: var(--ds-color-brand-medium-reverse); color: #fff; cursor: pointer;
    transition: background .2s ease, transform .15s;
  }
  .send-btn:hover { background: #4a80ff; }
  .send-btn.pressed { transform: scale(.85); }
  .send-btn svg { width: 18px; height: 18px; }

  /* 链接输出面板（生成链接后显示） */
  .output {
    display: none; width: 100%; padding: 20px 22px; text-align: center;
    background: var(--ds-color-bg-surface-1); border: 1px solid var(--ds-color-border-subtle);
    border-radius: var(--ds-radius-panel); backdrop-filter: blur(var(--ds-blur-glass));
    -webkit-backdrop-filter: blur(var(--ds-blur-glass));
  }
  .output .hint { color: var(--ds-color-text-secondary); font-size: 15px; margin: 0 0 12px; }
  .output .url {
    width: 100%; padding: 12px 16px; border-radius: var(--ds-radius-input);
    border: 1px solid var(--ds-color-border-default); background: rgba(255,255,255,.6);
    font-size: 14px; color: var(--ds-color-text-primary); text-align: center; outline: none;
  }
  .tool-btns { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  .tool-btns button {
    padding: 8px 24px; border-radius: var(--ds-radius-pill); font-size: 14px; cursor: pointer;
    border: 1px solid var(--ds-btn-secondary-border); background: var(--ds-btn-secondary-bg);
    color: var(--ds-btn-secondary-text); font-family: inherit; transition: border-color .2s, color .2s;
  }
  .tool-btns button:hover { border-color: var(--ds-color-brand-medium-reverse); color: var(--ds-color-brand-medium-reverse); }

  /* 主 CTA 按钮 */
  .hero-cta { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 16px; width: 100%; }

  /* ==================== Toast / 教程箭头 ==================== */
  .toast {
    position: fixed; top: 76px; left: 50%; transform: translateX(-50%);
    background: rgba(30,35,44,.92); color: #fff; padding: 10px 20px; border-radius: 20px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 200;
    max-width: 92vw; text-align: center;
  }
  .toast.show { opacity: 1; }
  /* 教程指示器：鼠标指针 + 点击涟漪 */
  #arrow {
    position: fixed; left: 0; top: 0; width: 16px; height: 24px; pointer-events: none;
    display: none; z-index: 300;
    transition: left .9s cubic-bezier(.4,0,.2,1), top .9s cubic-bezier(.4,0,.2,1);
    filter: drop-shadow(0 3px 8px rgba(30,35,44,.22));
  }
  #arrow svg { display: block; width: 16px; height: 24px; }
  #arrow .ripple {
    position: absolute; left: -5px; top: -5px; width: 12px; height: 12px;
    border-radius: 50%; background: rgba(77,107,254,.45);
    animation: click-ripple 1.5s ease-out infinite;
  }
  @keyframes click-ripple {
    0%        { transform: scale(.5); opacity: .9; }
    70%, 100% { transform: scale(2.8); opacity: 0; }
  }

  /* 入场动画 */
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  .rise { opacity: 0; transform: translateY(40px); animation: rise .6s ease forwards; }
  .delay-1 { animation-delay: .08s; }
  .delay-2 { animation-delay: .18s; }

  /* ==================== 响应式 ==================== */
  @media (min-width: 768px) {
    .slogan { font-size: 42px; }
    .header-wrapper { width: min(100% - 144px, 1140px); }
  }
  @media (min-width: 1024px) {
    .slogan { font-size: 46px; letter-spacing: .4em; }
    .header-wrapper { width: min(100% - 160px, 1280px); }
  }
  @media (min-width: 440px) {
    .toggle .lbl { display: inline; }
  }
  @media (max-width: 767px) {
    .header-right .qr-trigger .btn-nav { display: none; }
    .hero-inner { padding-top: 48px; }
    .locale-toggle--desktop { display: none; }
  }
  @media (max-width: 380px) {
    .header-right .locale-toggle { display: none; }
  }
</style>
</head>

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
              和 DeepSeek 对话
            </a>
            <a class="btn btn-secondary btn-m" href="https://platform.deepseek.com/" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M14 4l-4 16"/></svg>
              使用 API 开放平台
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <div id="arrow">
    <span class="ripple"></span>
    <svg viewBox="0 0 16 24" fill="none">
      <path d="M1.2 1.2 L1.2 20.6 L5.9 15.9 L8.8 22.6 L12.1 21.1 L9.2 14.6 L14.8 14.6 Z"
            fill="#fff" stroke="#1e232c" stroke-width="1.4" stroke-linejoin="round"/>
    </svg>
  </div>

  <script>
  (function () {
    var $ = function (s) { return document.querySelector(s); };
    var input = $('#kw');
    var sendBtn = $('#send');
    var output = $('#output');
    var outLink = $('#outLink');
    var outTut = $('#outTut');
    var tutText = $('#tutText');
    var stopBtn = $('#stopBtn');
    var urlOutput = $('#url-output');
    var tagThink = $('#tagThink');
    var tagSearch = $('#tagSearch');
    var toast = $('#toast');
    var arrow = $('#arrow');
    var headerBar = $('#headerBar');
    var playing = false;
    var aborted = false;
    var timers = [];
    var thinkOn = false;
    var searchOn = false; // 两个开关默认关闭

    // 教程动画的定时器统一登记，便于「快停下」时一次性清除
    function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }
    function every(fn, ms) { var t = setInterval(fn, ms); timers.push(t); return t; }
    function clearTimers() {
      timers.forEach(function (t) { clearTimeout(t); clearInterval(t); });
      timers = [];
    }

    // 顶部居中提示（复制结果等）
    function tip(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(tip._t);
      tip._t = setTimeout(function () { toast.classList.remove('show'); }, 3200);
    }

    // 链接输出面板：显示生成的分享链接
    function showLink(url) {
      outTut.classList.add('hidden');
      outLink.classList.remove('hidden');
      output.style.display = 'block';
      urlOutput.value = url;
    }

    // 教程提示：复用链接输出面板的位置（两者不会同时出现）
    function tutTip(msg) {
      outLink.classList.add('hidden');
      outTut.classList.remove('hidden');
      output.style.display = 'block';
      tutText.textContent = msg;
    }

    // 顶栏滚动态
    window.addEventListener('scroll', function () {
      headerBar.classList.toggle('is-scrolled', window.scrollY > 8);
    }, { passive: true });

    var query = '';
    try {
      var sp = new URLSearchParams(location.search);
      query = sp.get('q') || '';
      if (sp.get('think') === 'true') { thinkOn = true; tagThink.classList.add('selected'); }
      if (sp.get('search') === 'true') { searchOn = true; tagSearch.classList.add('selected'); }
    } catch (e) {}
    if (query) { try { query = decodeURIComponent(query); } catch (e) {} }
    tagSearch.classList.toggle('selected', searchOn);

    function buildParams(q) {
      var p = new URLSearchParams();
      p.set('q', q);
      if (thinkOn) p.set('think', 'true');
      if (searchOn) p.set('search', 'true');
      return p.toString();
    }
    function linkFor(q) {
      return location.href.split('#')[0].split('?')[0] + '?' + buildParams(q);
    }

    function moveArrow(el, done) {
      arrow.style.display = 'block';
      var r = el.getBoundingClientRect();
      // 让指针尖端（元素左上角）正好落在目标中心
      arrow.style.left = (r.left + r.width / 2) + 'px';
      arrow.style.top = (r.top + r.height / 2) + 'px';
      if (done) later(done, 950);
    }

    // 整蛊教程：字缓慢输入 -> 指针移向发送 -> 跳转聊天界面
    function playTutorial(q) {
      playing = true;
      sendBtn.disabled = true;
      tutTip('让我来教你正确的打开方式');
      later(function () {
        moveArrow(input, function () {
          if (aborted) return;
          tutTip('1、找到输入框，输入你的问题');
          var i = 0;
          var t = every(function () {
            input.value = q.slice(0, i + 1);
            i++;
            if (i >= q.length) {
              clearInterval(t);
              moveArrow(sendBtn, function () {
                if (aborted) return;
                tutTip('2、点击「发送」按钮');
                sendBtn.classList.add('pressed');
                later(function () {
                  location.href = 'chat.html?' + buildParams(q);
                }, 1100);
              });
            }
          }, 180);
          input.focus();
        });
      }, 1100);
    }

    // 自己人快速通道：中断教程，恢复正常页面交互
    stopBtn.addEventListener('click', function () {
      if (!playing) return;
      aborted = true;
      playing = false;
      clearTimers();
      arrow.style.display = 'none';
      sendBtn.classList.remove('pressed');
      sendBtn.disabled = false;
      input.value = query; // 补全被打断的问题，便于直接修改或重新生成链接
      outTut.classList.add('hidden');
      output.style.display = '';
    });

    // 生成分享链接（无 ?q= 时）
    function submit() {
      if (playing) return;
      var q = input.value.trim();
      if (!q) { tip('搜了个寂寞？'); return; }
      showLink(linkFor(q));
      urlOutput.focus(); urlOutput.select();
      output.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    tagThink.addEventListener('click', function () {
      thinkOn = !thinkOn;
      tagThink.classList.toggle('selected', thinkOn);
      tagThink.setAttribute('aria-pressed', String(thinkOn));
    });
    tagSearch.addEventListener('click', function () {
      searchOn = !searchOn;
      tagSearch.classList.toggle('selected', searchOn);
      tagSearch.setAttribute('aria-pressed', String(searchOn));
    });

    sendBtn.addEventListener('click', submit);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
    });

    $('#copy').addEventListener('click', function () {
      navigator.clipboard.writeText(urlOutput.value)
        .then(function () { tip('复制成功！赶紧把链接甩给伸手党们！'); })
        .catch(function () { tip('复制失败，请手动复制。'); });
    });
    $('#preview').addEventListener('click', function () {
      if (urlOutput.value) window.open(urlOutput.value);
    });

    if (query) playTutorial(query);
    else input.focus();
  })();
  </script>
</body>
</html>
