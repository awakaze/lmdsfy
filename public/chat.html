<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#151517" />
<title>DeepSeek - 探索未至之境</title>
<link rel="icon" href="/deepseek.svg" />
<style>
  /* ==========================================================================
     设计令牌提取自官方样式表 https://fe-static.deepseek.com/chat/static/main.css
     （--dsw-static-* / --dsw-alias-* / --dsw-specific-*，此处取其深色模式取值）
     ========================================================================== */
  :root {
    /* 静态色板 */
    --dsw-static-neutral-bluish-50: #f9fafb;
    --dsw-static-neutral-bluish-300: #cfd3d6;
    --dsw-static-neutral-bluish-400: #adb2b8;
    --dsw-static-neutral-bluish-600: #81858c;
    --dsw-static-neutral-bluish-700: #61666b;
    --dsw-static-neutral-bluish-750: #43454a;
    --dsw-static-neutral-bluish-800: #353638;
    --dsw-static-neutral-bluish-850: #2c2c2e;
    --dsw-static-neutral-bluish-875: #232324;
    --dsw-static-neutral-bluish-900: #1b1b1c;
    --dsw-static-neutral-bluish-950: #151517;
    --dsw-static-neutral-600: #545557;
    --dsw-static-neutral-700: #3c3c3d;
    --dsw-static-deepseek-400: #679efe;
    --dsw-static-deepseek-450: #5686fe;
    --dsw-static-deepseek-500: #3964fe;
    --dsw-static-deepseek-600: #4868b2;
    --dsw-static-deepseek-900: #283142;

    /* 语义别名（对应官方 --dsw-alias-*） */
    --bg: var(--dsw-static-neutral-bluish-950);
    --bg-sidebar: var(--dsw-static-neutral-bluish-900);
    --bg-elevated: var(--dsw-static-neutral-bluish-875);
    --bg-input: var(--dsw-static-neutral-bluish-850);
    --bg-hover: rgba(255, 255, 255, .08);
    --nav-hover: var(--dsw-static-neutral-bluish-850);
    --nav-active: var(--dsw-static-neutral-bluish-750);
    --border: rgba(255, 255, 255, .12);
    --border-soft: rgba(255, 255, 255, .06);
    --text: var(--dsw-static-neutral-bluish-50);
    --text-secondary: var(--dsw-static-neutral-bluish-300);
    --text-tertiary: var(--dsw-static-neutral-bluish-400);
    --text-caption: var(--dsw-static-neutral-bluish-600);
    --accent: var(--dsw-static-deepseek-450);
    --accent-hover: var(--dsw-static-deepseek-500);
    --accent-active: var(--dsw-static-deepseek-600);
    --user-bubble: var(--dsw-static-neutral-bluish-850);
    --code-bg: var(--dsw-static-neutral-bluish-900);
    --code-banner: var(--dsw-static-neutral-bluish-850);
    --tool-bg: var(--dsw-static-deepseek-900);
    --tool-active: var(--dsw-static-deepseek-400);
    --radius: 24px;
    --sider-width: 261px;
    --msg-max: 840px;
    --msg-pad: 44px;
    --font: "quote-cjk-patch", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-code: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--font);
    font-size: 14px; line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(86, 134, 254, .35); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--dsw-static-neutral-700); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--dsw-static-neutral-600); }

  .app { display: flex; height: 100vh; overflow: hidden; }

  /* 侧边栏 —— 宽 261px，填充色对应 --dsw-specific-sidebar-fill */
  .sidebar {
    width: var(--sider-width); flex: 0 0 var(--sider-width); min-width: 0;
    background: var(--bg-sidebar); border-right: 1px solid var(--border-soft);
    display: flex; flex-direction: column; padding: 10px; gap: 4px;
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 8px 10px 14px; }
  .brand .logo { width: 24px; height: 24px; flex: none; }
  .brand .name { font-size: 20px; font-weight: 600; letter-spacing: -.4px; }
  .new-chat {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; height: 40px;
    background: transparent; border: none;
    border-radius: 10px; color: var(--text); font-size: 14px; font-family: inherit;
    cursor: pointer; transition: background .15s;
  }
  .new-chat:hover { background: var(--nav-hover); }
  .new-chat svg { width: 16px; height: 16px; }
  .side-section { margin-top: 14px; padding: 0 10px 6px; font-size: 12px; color: var(--text-caption); }
  .conv-list { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  .conv-item {
    text-align: left; width: 100%; height: 38px; padding: 0 10px; border-radius: 10px;
    background: transparent; border: none; color: var(--text-secondary);
    font-size: 14px; font-family: inherit; cursor: pointer; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; transition: background .12s;
  }
  .conv-item:hover { background: var(--nav-hover); }
  .conv-item.active { background: var(--nav-active); color: var(--text); }
  .side-empty { padding: 18px 8px; text-align: center; color: var(--text-caption); font-size: 13px; }
  .side-footer { margin-top: auto; }
  .side-user { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 10px; border-radius: 12px; cursor: pointer; }
  .side-user:hover { background: var(--nav-hover); }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, var(--dsw-static-deepseek-450), var(--dsw-static-deepseek-500));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 600;
  }
  .side-user .u-name { font-size: 14px; }

  /* 主区 */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 56px; flex: none; display: flex; align-items: center;
    padding: 0 20px;
  }
  .model-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 10px; border-radius: 10px; border: none; background: transparent;
    color: var(--text-secondary); font-family: inherit; font-size: 15px; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .model-pill:hover { background: var(--bg-hover); color: var(--text); }
  .model-pill svg { width: 14px; height: 14px; }

  /* 消息列表：max-width 840px，左右内边距 44px（官方 --message-list-*） */
  .chat { flex: 1; overflow-y: auto; position: relative; }
  .chat-inner {
    max-width: calc(var(--msg-max) + var(--msg-pad) * 2);
    margin: 0 auto; padding: 8px var(--msg-pad) 40px;
  }

  .welcome { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 12vh; }
  .welcome .big-logo { width: 56px; height: 56px; margin-bottom: 18px; }
  .welcome h1 { font-size: 24px; font-weight: 500; margin: 0 0 6px; letter-spacing: -.2px; }
  .welcome .sub { color: var(--text-tertiary); margin: 0 0 30px; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip {
    padding: 9px 16px; border-radius: 12px;
    border: 1px solid var(--border-soft); background: var(--bg-elevated);
    color: var(--text-secondary); font-size: 14px; cursor: pointer; transition: all .15s;
  }
  .chip:hover { background: var(--nav-active); color: var(--text); }

  /* 消息 */
  .msg { display: flex; gap: 12px; padding: 12px 0; }
  .msg .ai-avatar { width: 28px; height: 28px; flex: none; margin-top: 2px; }
  .msg .body { flex: 1; min-width: 0; }
  .msg .who { font-size: 14px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
  .msg.assistant .body { color: var(--text); font-size: 15px; line-height: 1.75; }

  /* 用户气泡：右侧胶囊（官方 --dsw-specific-bubble） */
  .msg.user { justify-content: flex-end; padding: 12px 0; }
  .msg.user .bubble {
    background: var(--user-bubble); color: var(--text);
    padding: 10px 16px; border-radius: 16px; max-width: 80%; font-size: 15px;
  }
  .msg.user .bubble .md p { margin: 0; }

  /* markdown */
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md p { margin: 0 0 12px; }
  .md h1, .md h2, .md h3, .md h4 { margin: 20px 0 10px; font-weight: 600; line-height: 1.4; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 18px; } .md h3 { font-size: 16px; }
  .md ul, .md ol { margin: 0 0 12px; padding-left: 22px; }
  .md li { margin: 4px 0; }
  .md code { font-family: var(--font-code); font-size: 13px; background: var(--code-banner); padding: 2px 5px; border-radius: 6px; }
  .md pre { position: relative; background: var(--code-bg); border: 1px solid var(--border-soft); border-radius: 12px; padding: 14px 16px; overflow-x: auto; margin: 0 0 12px; }
  .md pre code { background: none; padding: 0; font-size: 13px; line-height: 1.65; }
  .md pre .copy { position: absolute; top: 8px; right: 8px; background: var(--code-banner); border: none; color: var(--text-tertiary); font-size: 12px; padding: 4px 10px; border-radius: 8px; cursor: pointer; opacity: 0; transition: opacity .15s, color .15s; }
  .md pre .copy:hover { color: var(--text); }
  .md pre:hover .copy { opacity: 1; }
  .md blockquote { border-left: 3px solid var(--border); margin: 0 0 12px; padding: 2px 0 2px 14px; color: var(--text-secondary); }
  .md table { border-collapse: collapse; margin: 0 0 12px; font-size: 14px; }
  .md th, .md td { border: 1px solid var(--border-soft); padding: 8px 14px; }
  .md th { background: var(--code-banner); font-weight: 600; }
  .md a { color: var(--dsw-static-deepseek-400); text-decoration: none; }
  .md a:hover { text-decoration: underline; }

  /* 深度思考折叠块 */
  .think { border: 1px solid var(--border-soft); border-radius: 14px; margin-bottom: 14px; background: var(--bg-elevated); }
  .think summary { list-style: none; cursor: pointer; padding: 11px 14px; color: var(--text-secondary); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .think summary::-webkit-details-marker { display: none; }
  .think summary::before { content: "💭"; font-size: 13px; }
  .think summary .lbl::after { content: "深度思考中…"; }
  .think[open] summary .lbl { display: none; }
  .think[open] summary::after { content: "隐藏思考过程"; margin-left: auto; color: var(--text-caption); font-size: 12px; }
  .think .think-body { padding: 10px 14px 14px; color: var(--text-tertiary); font-size: 13px; line-height: 1.7; border-top: 1px solid var(--border-soft); white-space: pre-wrap; }

  /* 联网搜索：检索状态与来源卡片 */
  .search-status { display: flex; align-items: center; gap: 8px; margin: 2px 0 14px; color: var(--text-tertiary); font-size: 13px; }
  .search-status svg { width: 14px; height: 14px; flex: none; animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sources { border: 1px solid var(--border-soft); border-radius: 14px; margin-bottom: 14px; background: var(--bg-elevated); }
  .sources summary { list-style: none; cursor: pointer; padding: 11px 14px; color: var(--text-secondary); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .sources summary::-webkit-details-marker { display: none; }
  .sources summary svg { width: 14px; height: 14px; flex: none; }
  .sources summary .more { margin-left: auto; color: var(--text-caption); font-size: 12px; }
  .sources summary .more::after { content: "展开来源"; }
  .sources[open] summary .more::after { content: "收起来源"; }
  .sources .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; padding: 2px 14px 14px; }
  .source-card {
    display: flex; gap: 8px; align-items: flex-start; padding: 9px 10px;
    border: 1px solid var(--border-soft); border-radius: 10px; background: var(--bg-sidebar);
    text-decoration: none; transition: background .15s;
  }
  .source-card:hover { background: var(--nav-hover); }
  .source-card img { width: 16px; height: 16px; flex: none; border-radius: 4px; margin-top: 2px; }
  .source-card .sc-txt { min-width: 0; }
  .source-card .sc-site { font-size: 12px; color: var(--text-caption); line-height: 1.4; }
  .source-card .sc-title {
    font-size: 13px; color: var(--text); line-height: 1.45; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  sup.cite a { color: var(--dsw-static-deepseek-400); font-size: 11px; text-decoration: none; margin: 0 1px; }
  sup.cite a:hover { text-decoration: underline; }

  .cursor { display: inline-block; width: 8px; height: 16px; background: var(--accent); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* 输入区：文本框整行在上，工具按钮与发送按钮同处底部一行（与官方布局一致） */
  .composer-wrap { flex: none; padding: 0 24px 20px; }
  .composer {
    max-width: var(--msg-max); margin: 0 auto;
    background: var(--bg-input); border: 1px solid transparent;
    border-radius: var(--radius); padding: 14px 12px 10px 16px;
    transition: border-color .15s, box-shadow .15s;
  }
  .composer:focus-within { border-color: var(--accent-active); box-shadow: 0 0 0 3px rgba(86, 134, 254, .12); }
  .composer textarea {
    display: block; width: 100%; border: none; outline: none; background: transparent;
    color: var(--text); font-family: inherit; font-size: 16px; line-height: 1.6;
    resize: none; max-height: 200px; padding: 0 4px 8px; min-height: 26px;
  }
  .composer textarea::placeholder { color: var(--text-caption); }
  .composer-foot { display: flex; align-items: center; gap: 10px; }
  .composer-tools { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; }
  .tool-btn {
    display: inline-flex; align-items: center; gap: 6px; height: 32px;
    padding: 0 12px; border-radius: 16px; border: 1px solid transparent;
    background: transparent; color: var(--text-secondary); font-family: inherit;
    font-size: 13px; cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .tool-btn svg { width: 14px; height: 14px; }
  .tool-btn:hover { background: var(--bg-hover); }
  /* 选中态对应官方 --dsw-alias-button-ghost-active-fill / -border */
  .tool-btn.active {
    background: var(--tool-bg); border-color: var(--dsw-static-deepseek-600); color: var(--tool-active);
  }
  .send {
    width: 34px; height: 34px; border-radius: 50%; border: none; flex: none;
    background: var(--accent); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, opacity .15s;
  }
  .send:hover { background: var(--accent-hover); }
  .send:disabled { background: var(--nav-active); color: var(--text-caption); cursor: not-allowed; }
  .send svg { width: 18px; height: 18px; }

  .toast {
    position: fixed; left: 50%; bottom: 130px; transform: translateX(-50%);
    background: var(--dsw-static-neutral-bluish-750); color: var(--text);
    padding: 9px 16px; border-radius: 12px; font-size: 13px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 900px) {
    .sidebar { display: none; }
    .chat-inner { padding-left: 20px; padding-right: 20px; }
    .composer-wrap { padding-left: 16px; padding-right: 16px; }
  }
  @media (max-width: 560px) {
    .composer-tools .lbl { display: none; }
    .tool-btn { padding: 0 10px; }
  }
  :root[data-theme="light"] {
    --bg: #fff; --bg-sidebar: #f9fbff; --bg-elevated: #f7f8fa; --bg-input: #f3f4f6;
    --bg-hover: #eceef2; --nav-hover: #eef2fa; --nav-active: #e4eaff;
    --border: #dde0e5; --border-soft: #edf0f3; --text: #262626;
    --text-secondary: #4d4d4d; --text-tertiary: #777; --text-caption: #999;
    --accent: #4d6bfe; --user-bubble: #edf3ff; --code-bg: #f8f9fc; --code-banner: #edf0f5;
    --tool-bg: #e7edff; --tool-active: #4d6bfe;
  }
  .topbar { justify-content: space-between; }
  .send.stopping svg { display: none; }
  .send.stopping::after { content: ''; width: 12px; height: 12px; background: currentColor; border-radius: 2px; }
  .composer-tools .lbl { display: inline; }
</style>
<link rel="stylesheet" href="/chat.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img class="logo" src="/deepseek.svg" alt="deepseek" />
      <span class="name">deepseek</span><button id="sideCollapse" class="icon-btn" aria-label="收起侧栏" title="收起侧栏"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M9 4v16"/></svg></button>
    </div>
    <button class="new-chat" id="newChat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      开启新对话
    </button>
    <div class="side-section">对话</div>
    <div class="conv-list" id="convList"></div>
    <div class="side-footer">
      <button id="themeToggle" class="side-settings" type="button" aria-label="切换主题" title="切换主题"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/></svg><span>外观</span></button>
    </div>
  </aside>

  <div class="main empty">
    <div class="topbar">
      <img class="top-logo" src="/deepseek.svg" alt="DeepSeek">
      <div class="header-tools">
        <button id="sidebarToggle" class="icon-btn" aria-label="展开侧栏" title="展开侧栏"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M9 4v16"/></svg></button>
        <button id="historySearchBtn" class="icon-btn" aria-label="搜索历史对话" title="搜索历史对话"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
        <button id="topNewChat" class="icon-btn" aria-label="开启新对话" title="开启新对话"><svg viewBox="0 0 24 24"><path d="M5 19l-2 2v-9a9 9 0 119 9H7M12 7v10M7 12h10"/></svg></button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="chat-inner" id="chatInner">
        <div class="welcome" id="welcome">
          <img class="big-logo" src="/deepseek.svg" alt="deepseek" />
          <h1>欢迎回来，随时开始吧</h1>
          <p class="sub">有什么可以帮你的吗？</p>
          <div class="chips" id="chips">
            <span class="chip">帮我写一段代码</span>
            <span class="chip">解释一下相对论</span>
            <span class="chip">推荐几本好书</span>
            <span class="chip">制定一个旅行计划</span>
          </div>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer" id="composer"><div id="attachments" class="attachments" aria-live="polite"></div>
        <textarea id="input" rows="1" placeholder="给 DeepSeek 发送消息"></textarea>
        <div class="composer-foot">
          <div class="composer-tools">
            <button class="tool-btn" id="thinkBtn" type="button">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="8" cy="8" rx="7.4" ry="3" transform="rotate(-45 8 8)"/><ellipse cx="8" cy="8" rx="7.4" ry="3" transform="rotate(45 8 8)"/><circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/></svg>
              <span class="lbl">深度思考</span>
            </button>
            <button class="tool-btn" id="searchBtn" type="button">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.85"/><ellipse cx="8" cy="8" rx="2.9" ry="6.85"/><path d="M1.6 8h12.8"/></svg>
              <span class="lbl">智能搜索</span>
            </button>
          </div>
          <button class="icon-btn" id="micBtn" aria-label="语音输入" title="语音输入"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0014 0v-2M12 19v3m-4 0h8"/></svg></button>
          <button class="icon-btn" id="uploadBtn" aria-label="上传文件" title="上传图片或文件"><svg viewBox="0 0 24 24"><path d="M8 12v4a4 4 0 008 0V6a3 3 0 00-6 0v10a1 1 0 002 0V7M6 7v9a6 6 0 0012 0V6"/></svg></button>
          <input type="file" id="fileInput" multiple hidden>
          <button class="send" id="sendBtn" aria-label="发送消息" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
      <div class="disclaimer">内容由 AI 生成，请仔细甄别</div>
    </div>
  </div>
</div>
<button id="sidebarBackdrop" class="sidebar-backdrop" aria-label="收起侧栏"></button>

<dialog id="historySearch" class="history-search"><div class="search-heading"><span>搜索历史对话</span><button id="closeHistorySearch" class="icon-btn" aria-label="关闭搜索">×</button></div><input id="historyQuery" placeholder="搜索对话" autocomplete="off"><div id="historyResults"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/media.js"></script>
<script src="/history.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const chatInner = $('#chatInner');
  const chatScroller = $('#chat');
  const welcome = $('#welcome');
  const convList = $('#convList');
  const input = $('#input');
  const sendBtn = $('#sendBtn');
  const thinkBtn = $('#thinkBtn');
  const searchBtn = $('#searchBtn');
  const toast = $('#toast');

  const LS_KEY = 'lmds.conversations';
  let think = false;
  let search = false;
  let busy = false;
  let controller = null;
  let currentId = null;
  let conversations = (function () {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch (e) { return []; }
  })();

  const media = createChatMedia({
    notify: showToast,
    onTranscript: text => { input.value += (input.value ? ' ' : '') + text; autoResize(); updateSend(); input.focus(); },
    onChange: (files, active) => {
      const area = $('#attachments'); area.replaceChildren();
      files.forEach(file => {
        const card = document.createElement('div'); card.className = 'attachment';
        const info = document.createElement('span'); info.textContent = (file.image ? '▧ ' : '▤ ') + file.name;
        const status = document.createElement('small'); status.textContent = file.error || (file.status + (file.status === '上传中' ? ' ' + file.progress + '%' : ''));
        const remove = document.createElement('button'); remove.textContent = '×'; remove.setAttribute('aria-label', '移除 ' + file.name); remove.onclick = () => media.remove(file.token);
        card.append(info, status, remove); area.append(card);
      });
      $('#micBtn').classList.toggle('recording', active);
      $('#micBtn').setAttribute('aria-label', active ? '结束录音' : '语音输入');
      updateSend();
    },
  });
  function updateSend() { sendBtn.disabled = !busy && (media.active || media.pending.some(f => !f.id) || (!input.value.trim() && !media.pending.length)); }
  $('#uploadBtn').onclick = () => { if (!busy) $('#fileInput').click(); };
  $('#fileInput').onchange = e => { media.upload(Array.from(e.target.files)); e.target.value = ''; };
  $('#micBtn').onclick = () => { if (!busy) media.toggleRecording(); };
  $('#composer').ondragover = e => { e.preventDefault(); $('#composer').classList.add('dragging'); };
  $('#composer').ondragleave = () => $('#composer').classList.remove('dragging');
  $('#composer').ondrop = e => { e.preventDefault(); $('#composer').classList.remove('dragging'); if (!busy) media.upload(Array.from(e.dataTransfer.files)); };
  input.addEventListener('paste', e => { const files = Array.from(e.clipboardData.files); if (files.length && !busy) { e.preventDefault(); media.upload(files); } });
  function toggleSidebar() {
    if (matchMedia('(max-width: 900px)').matches) document.body.classList.toggle('sidebar-open');
    else document.body.classList.toggle('sidebar-collapsed');
  }
  $('#sidebarToggle').onclick = toggleSidebar;
  $('#sideCollapse').onclick = toggleSidebar;
  $('#topNewChat').onclick = newChat;
  function searchHistory() {
    const q = $('#historyQuery').value.trim().toLowerCase();
    const results = $('#historyResults'); results.replaceChildren();
    conversations.filter(c => !q || c.title.toLowerCase().includes(q) || c.messages.some(m => String(m.content).toLowerCase().includes(q))).slice(0, 50).forEach(c => {
      const item = document.createElement('button'); item.textContent = c.title; item.onclick = () => { $('#historySearch').close(); openConv(c.id); }; results.append(item);
    });
    if (!results.children.length) results.textContent = '未找到相关对话';
  }
  $('#historySearchBtn').onclick = () => { searchHistory(); $('#historySearch').showModal(); $('#historyQuery').focus(); };
  $('#historyQuery').oninput = searchHistory;
  $('#closeHistorySearch').onclick = () => $('#historySearch').close();
  $('#sidebarBackdrop').onclick = () => document.body.classList.remove('sidebar-open');
  function persist() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(conversations)); } catch (e) {}
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function renderMd(text) {
    if (window.DOMPurify && window.marked && typeof window.marked.parse === 'function') {
      try { return DOMPurify.sanitize(window.marked.parse(text)); } catch (e) {}
    }
    return '<p>' + esc(text).replace(/\n/g, '<br>') + '</p>';
  }
  function scrollBottom() { chatScroller.scrollTop = chatScroller.scrollHeight; }
  function showToast(msg) {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  /* ===== 历史会话 ===== */
  function renderConvList() {
    convList.innerHTML = '';
    if (!conversations.length) {
      convList.innerHTML = '<div class="side-empty">暂无对话</div>';
      return;
    }
    conversations.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).forEach((c) => {
      const item = document.createElement('button');
      item.className = 'conv-item' + (c.id === currentId ? ' active' : '');
      item.textContent = c.title || '新对话';
      item.onclick = () => openConv(c.id);
      const row = document.createElement('div'); row.className = 'conv-row';
      const menu = document.createElement('details'); menu.className = 'conv-menu';
      const trigger = document.createElement('summary'); trigger.textContent = '···'; trigger.setAttribute('aria-label', '管理对话 ' + c.title);
      const rename = document.createElement('button'); rename.textContent = '重命名'; rename.onclick = () => { if (busy) return; const title = prompt('对话名称', c.title); if (title?.trim()) { c.title = title.trim().slice(0, 100); persist(); renderConvList(); } };
      const del = document.createElement('button'); del.textContent = '删除'; del.onclick = () => { if (busy || !confirm('删除这段本地对话？')) return; conversations = conversations.filter(x => x.id !== c.id); if (currentId === c.id) newChat(); persist(); renderConvList(); };
      menu.append(trigger, rename, del); row.append(item, menu); convList.appendChild(row);
    });
  }

  function clearChat() {
    chatInner.innerHTML = '';
    chatInner.appendChild(welcome);
    welcome.style.display = 'flex';
    $('.main').classList.add('empty');
  }
  function newChat() {
    if (busy) return;
    media.stopSpeech();
    document.body.classList.remove('sidebar-open');
    currentId = null;
    window.history.replaceState(null, '', location.pathname);
    clearChat();
    renderConvList();
    input.focus();
  }

  function buildUserBubble(text, attachments = []) {
    const el = document.createElement('div');
    el.className = 'msg user';
    el.innerHTML = '<div class="bubble"><div class="md">' + renderMd(text) + '</div></div>';
    if (attachments.length) {
      const list = document.createElement('div'); list.className = 'sent-files';
      attachments.forEach(f => { const card = document.createElement('div'); card.className = 'attachment'; card.textContent = (f.image ? '▧ ' : '▤ ') + f.name; list.append(card); });
      el.querySelector('.bubble').prepend(list);
    }
    return el;
  }
  function actionButton(label, paths) {
    const button = document.createElement('button'); button.type = 'button';
    button.setAttribute('aria-label', label); button.title = label;
    button.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + paths + '</svg>';
    return button;
  }
  function addAnswerActions(el, content, conv, index) {
    const message = conv?.messages[index];
    if ((!content && !message?.variants) || el.querySelector('.answer-actions')) return;
    const bar = document.createElement('div'); bar.className = 'answer-actions';
    if (message?.variants?.length > 1) {
      const nav = document.createElement('div'); nav.className = 'version-nav';
      const current = message.variantIndex || 0;
      const previous = actionButton('上一个回答', '<path d="m14 6-6 6 6 6"/>');
      const next = actionButton('下一个回答', '<path d="m10 6 6 6-6 6"/>');
      previous.disabled = current === 0; next.disabled = current === message.variants.length - 1;
      const label = document.createElement('span'); label.textContent = (current + 1) + ' / ' + message.variants.length;
      label.setAttribute('aria-label', '回答版本');
      const select = target => { if (busy) return; media.stopSpeech(); ChatHistory.selectVersion(conv, index, target); persist(); openConv(conv.id); };
      previous.onclick = () => select(current - 1); next.onclick = () => select(current + 1);
      nav.append(previous, label, next); bar.append(nav);
    }
    const copy = actionButton('复制', '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 00-2-2H5a2 2 0 00-2 2v9a2 2 0 002 2h3"/>');
    copy.disabled = !content;
    copy.onclick = () => navigator.clipboard.writeText(content).then(() => showToast('已复制')).catch(() => showToast('复制失败'));
    const read = actionButton('朗读', '<g class="speech-ready"><path d="m11 4-6 5H2v6h3l6 5V4Z"/><path d="M15 8a6 6 0 010 8M18 5a10 10 0 010 14"/></g><rect class="speech-stop" x="6" y="6" width="12" height="12" rx="2"/>');
    read.className = 'speech-button'; read.disabled = !content;
    read.onclick = () => { if (document.documentElement.dataset.ttsEnabled === 'true') media.speak(content, read); };
    const retry = actionButton('重新生成', '<path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0112-1l2 3M4 15l2 3a7 7 0 0012-1"/>');
    retry.onclick = () => {
      if (busy || !conv) return;
      const pending = ChatHistory.prepareRegeneration(conv, index);
      const user = pending.prefix.findLast(m => m.role === 'user');
      if (!user) return;
      openConv(conv.id, pending.prefix);
      sendQuestion(user.content, user.attachments || [], pending);
    };
    bar.append(copy, read, retry); el.querySelector('.body').append(bar);
  }
  function buildAssistantBlock(content, reasoning, sources, annotations) {
    const el = document.createElement('div');
    el.className = 'msg assistant';
    el.innerHTML =
      '<img class="ai-avatar" src="/deepseek.svg" alt="">' +
      '<div class="body"><div class="who">DeepSeek</div></div>';
    const body = el.querySelector('.body');
    if (Array.isArray(sources) && sources.length) body.appendChild(buildSourcesPanel(sources, false));
    if (reasoning) {
      const thinkEl = document.createElement('details');
      thinkEl.className = 'think done';
      thinkEl.innerHTML = '<summary><span class="lbl"></span></summary><div class="think-body">' + esc(reasoning) + '</div>';
      body.appendChild(thinkEl);
    }
    const md = document.createElement('div');
    md.className = 'md';
    md.innerHTML = content ? renderAnswer(content, sources || [], annotations || []) : '';
    body.appendChild(md);
    applyCopyButtons(md);
    return el;
  }

  /* 联网搜索：来源卡片列表（对应官方「已搜索到 N 个网页」折叠块） */
  function buildSourcesPanel(list, open) {
    const d = document.createElement('details');
    d.className = 'sources';
    if (open) d.open = true;
    d.innerHTML =
      '<summary>' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
      '已搜索到 ' + list.length + ' 个网页' +
      '<span class="more"></span></summary>' +
      '<div class="grid"></div>';
    const grid = d.querySelector('.grid');
    list.forEach((s) => {
      const a = document.createElement('a');
      a.className = 'source-card';
      a.href = safeUrl(s.url) || '#';
      a.target = '_blank';
      a.rel = 'noopener';
      let host = '';
      try { host = new URL(s.url).hostname.replace(/^www\./, ''); } catch (e) {}
      a.innerHTML =
        (safeUrl(s.site_icon) ? '<img src="' + esc(safeUrl(s.site_icon)) + '" alt="" onerror="this.style.display=\'none\'">' : '') +
        '<div class="sc-txt"><div class="sc-site">' + esc(s.site_name || host) + '</div>' +
        '<div class="sc-title">' + esc(s.title || host) + '</div></div>';
      grid.appendChild(a);
    });
    return d;
  }

  /* 把回答中的 [n] 引用标注替换为可点击的来源角标 */
  function linkCites(html, sources) {
    if (!Array.isArray(sources) || !sources.length) return html;
    return html.replace(/\[(\d{1,2})\]/g, (m, n) => {
      const s = sources[Number(n) - 1];
      if (!s || !safeUrl(s.url)) return m;
      return '<sup class="cite"><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + n + '</a></sup>';
    });
  }

  function safeUrl(value) {
    try { const u = new URL(value); return ['https:', 'http:'].includes(u.protocol) ? u.href : ''; } catch (_) { return ''; }
  }
  function renderAnswer(content, sources, annotations) {
    const chars = Array.from(content);
    const markers = new Map();
    for (const a of annotations || []) {
      const c = a.url_citation;
      if (!c || !safeUrl(c.url) || !Number.isInteger(c.end_index) || c.end_index < 0 || c.end_index > chars.length) continue;
      let index = sources.findIndex(s => s.url === c.url);
      if (index < 0) { sources.push({ url: c.url, title: c.title }); index = sources.length - 1; }
      markers.set(c.end_index, (markers.get(c.end_index) || '') + '<sup class="cite"><a href="' + esc(safeUrl(c.url)) + '" target="_blank" rel="noopener noreferrer">' + (index + 1) + '</a></sup>');
    }
    let text = markers.get(0) || '';
    chars.forEach((c, i) => { text += c + (markers.get(i + 1) || ''); });
    const html = renderMd(text);
    return window.DOMPurify ? DOMPurify.sanitize(html, { ADD_ATTR: ['target'] }) : html;
  }

  function openConv(id, viewMessages = null) {
    if (busy) return;
    const c = conversations.find((x) => x.id === id);
    if (!c) return;
    media.stopSpeech();
    document.body.classList.remove('sidebar-open');
    $('.main').classList.remove('empty');
    currentId = id;
    chatInner.innerHTML = '';
    (viewMessages || c.messages).forEach((m, index) => {
      const el = m.role === 'user' ? buildUserBubble(m.content, m.attachments) : buildAssistantBlock(m.content, m.reasoning, m.sources, m.annotations);
      chatInner.appendChild(el);
      if (m.role === 'assistant') addAnswerActions(el, m.content, c, index);
    });
    renderConvList();
    scrollBottom();
    input.focus();
  }

  /* ===== 提问 ===== */
  async function sendQuestion(q, attachments = [], regeneration = null) {
    if (busy || !q.trim()) return;
    media.stopSpeech();
    $('.main').classList.remove('empty');
    busy = true;
    $('#uploadBtn').disabled = true; $('#micBtn').disabled = true;
    controller = new AbortController();
    sendBtn.disabled = false;
    sendBtn.setAttribute("aria-label", "停止回答");
    sendBtn.classList.add("stopping");
    try {
      const sp = new URLSearchParams();
      sp.set('q', q);
      if (think) sp.set('think', 'true');
      if (search) sp.set('search', 'true');
      window.history.replaceState(null, '', location.pathname + '?' + sp.toString());
    } catch (e) {}

    let conv = conversations.find((c) => c.id === currentId);
    if (!conv) {
      conv = { id: uid(), title: q.slice(0, 24), updatedAt: Date.now(), messages: [] };
      conversations.push(conv);
      currentId = conv.id;
    }
    if (!regeneration) conv.messages.push({ role: 'user', content: q, attachments });
    conv.updatedAt = Date.now();
    persist();
    renderConvList();

    if (welcome && welcome.parentNode) welcome.style.display = 'none';
    if (!regeneration) chatInner.appendChild(buildUserBubble(q, attachments));

    const el = document.createElement('div');
    el.className = 'msg assistant';
    el.innerHTML =
      '<img class="ai-avatar" src="/deepseek.svg" alt="">' +
      '<div class="body"><div class="who">DeepSeek</div><div class="md"></div></div>';
    chatInner.appendChild(el);
    const body = el.querySelector('.body');
    const mdEl = el.querySelector('.md');

    let content = '';
    let reasoning = '';
    let thinkEl = null;
    let sources = [];
    let annotations = [];
    let server_tool_calls = [];
    let sourcesPanel = null;
    let completed = false;
    let searchStatus = null;
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    mdEl.appendChild(cursor);

    // 搜索开启时先展示「正在搜索网页…」状态，等后端下发来源后再替换为来源卡片
    if (search) {
      searchStatus = document.createElement('div');
      searchStatus.className = 'search-status';
      searchStatus.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
        '<span>正在搜索网页…</span>';
      body.insertBefore(searchStatus, mdEl);
    }

    function flushThink() {
      if (reasoning && !thinkEl) {
        thinkEl = document.createElement('details');
        thinkEl.className = 'think';
        thinkEl.open = true;
        thinkEl.innerHTML = '<summary><span class="lbl"></span></summary><div class="think-body"></div>';
        body.insertBefore(thinkEl, mdEl);
      }
      if (thinkEl) thinkEl.querySelector('.think-body').textContent = reasoning;
    }
    function flushContent() {
      mdEl.innerHTML = renderAnswer(content, sources, annotations);
      mdEl.appendChild(cursor);
      applyCopyButtons(mdEl);
      scrollBottom();
    }

    // 保留网页工具签名，使后续追问能够引用已读网页。
    const history = (regeneration ? regeneration.prefix : conv.messages).map((m) => ({ role: m.role, content: m.role === 'user' && m.attachments?.length ? [{ type: 'text', text: m.content }, ...m.attachments.map(f => ({ type: 'file', file_id: f.id }))] : m.content, ...(m.server_tool_calls ? { server_tool_calls: m.server_tool_calls } : {}) }));

    try {
      const res = await fetch('/api/chat', {
        signal: controller.signal,
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history, think: think, search: search }),
      });
      if (!res.ok) {
        const t = await res.text();
        throw new Error(t || ('HTTP ' + res.status));
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buffer.indexOf('\n')) >= 0) {
          const line = buffer.slice(0, nl).trim();
          buffer = buffer.slice(nl + 1);
          if (!line.startsWith('data:')) continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') { completed = true; continue; }
          let j;
          try { j = JSON.parse(data); } catch (e) { continue; }
          if (j.error) throw new Error(j.error.message || '生成中断');
          const choice = j.choices && j.choices[0];
          if (!choice) continue;
          const event = choice.server_tool_event;
          if (event && event.call) {
            const call = event.call;
            if (!searchStatus) {
              searchStatus = document.createElement('div');
              searchStatus.className = 'search-status';
              body.insertBefore(searchStatus, mdEl);
            }
            const action = call.action || {};
            searchStatus.textContent = event.type === 'call_started'
              ? (action.type === 'search' ? '正在搜索：' + (action.queries || []).join('、') : '正在阅读：' + (action.url || '网页'))
              : (call.status === 'failed' ? '网页工具暂时不可用' : '网页检索完成');
            for (const source of [...(call.sources || []), ...(call.page ? [call.page] : [])]) {
              if (safeUrl(source.url) && !sources.some(s => s.url === source.url)) sources.push(source);
            }
            if (sources.length) {
              const panel = buildSourcesPanel(sources, false);
              if (sourcesPanel) sourcesPanel.replaceWith(panel); else body.insertBefore(panel, mdEl);
              sourcesPanel = panel;
            }
          }
          const delta = choice.delta || {};
          if (delta.server_tool_calls) server_tool_calls = delta.server_tool_calls;
          if (delta.annotations) { annotations = delta.annotations; flushContent(); }
          if (delta.title) { conv.title = delta.title; renderConvList(); }
          if (choice.finish_reason === 'content_filter') {
            content = '抱歉，这个问题暂时无法回答。'; reasoning = ''; annotations = [];
            if (thinkEl) { thinkEl.remove(); thinkEl = null; }
            flushContent();
          }
          if (choice.finish_reason === 'length') showToast('回答达到长度上限');
          if (delta.reasoning_content) { reasoning += delta.reasoning_content; flushThink(); }
          if (delta.content) { content += delta.content; flushContent(); }
        }
      }
      if (!completed) throw new Error('连接中断，回答可能不完整');
    } catch (err) {
      if (err.name === 'AbortError') { flushContent(); } else {
      if (searchStatus) { searchStatus.remove(); searchStatus = null; }
      mdEl.innerHTML = '<p style="color:#e5484d">请求失败：' + esc(String(err.message || err)) + '</p>';
      }
    } finally {
      if (searchStatus) searchStatus.remove();
      controller = null;
      sendBtn.classList.remove('stopping');
      sendBtn.setAttribute('aria-label', '发送消息');
      cursor.remove();
      if (thinkEl) thinkEl.open = false;
      if (content || reasoning) {
        const reply = { role: 'assistant', content, reasoning, sources: sources.slice(), annotations, server_tool_calls };
        if (regeneration) ChatHistory.commitRegeneration(conv, regeneration, reply);
        else conv.messages.push(reply);
        conv.updatedAt = Date.now();
        persist();
        renderConvList();
      }
      scrollBottom();
      busy = false;
      $('#uploadBtn').disabled = false; $('#micBtn').disabled = false;
      if (thinkEl) thinkEl.classList.add('done');
      if (regeneration) { openConv(conv.id); if (!content && !reasoning) showToast('未生成新回答，已保留原来的记录'); }
      else addAnswerActions(el, content, conv, conv.messages.length - 1);
      updateSend();
    }
  }

  function applyCopyButtons(root) {
    root.querySelectorAll('pre').forEach((pre) => {
      if (pre.querySelector('.copy')) return;
      const btn = document.createElement('button');
      btn.className = 'copy';
      btn.textContent = '复制';
      btn.onclick = () => {
        const code = pre.querySelector('code') ? pre.querySelector('code').innerText : pre.innerText;
        navigator.clipboard.writeText(code).then(() => {
          btn.textContent = '已复制';
          setTimeout(() => (btn.textContent = '复制'), 1500);
        }).catch(() => showToast('复制失败'));
      };
      pre.appendChild(btn);
    });
  }

  /* ===== 事件 ===== */
  function submit() {
    const q = input.value.trim() || (media.pending.length ? '请分析这些文件。' : '');
    if (!q || busy || media.active) return;
    const c = conversations.find(c => c.id === currentId);
    if ((c?.messages.reduce((n, m) => n + (m.attachments?.length || 0), 0) || 0) + media.pending.length > 20) { showToast('一段对话最多引用 20 个文件，请开启新对话'); return; }
    if (c?.messages.some(m => m.attachments?.some(f => f.expiresAt && f.expiresAt * 1000 < Date.now()))) { showToast('这段对话的附件已过期，请开启新对话并重新上传'); return; }
    let attachments;
    try { attachments = media.take(); } catch (e) { showToast(e.message); return; }
    input.value = '';
    autoResize();
    sendBtn.disabled = true;
    sendQuestion(q, attachments);
  }
  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 200) + 'px';
  }

  input.addEventListener('input', () => {
    autoResize();
    updateSend();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      submit();
    }
  });
  sendBtn.addEventListener('click', () => { if (busy && controller) controller.abort(); else submit(); });
  input.focus();

  thinkBtn.addEventListener('click', () => {
    think = !think;
    thinkBtn.classList.toggle('active', think);
    thinkBtn.setAttribute('aria-pressed', String(think));
  });

  searchBtn.addEventListener('click', () => {
    search = !search;
    searchBtn.classList.toggle('active', search);
    searchBtn.setAttribute('aria-pressed', String(search));
  });

  $('#newChat').addEventListener('click', newChat);

  document.querySelectorAll('.chip').forEach((chip) => {
    chip.addEventListener('click', () => {
      if (busy) return;
      input.value = chip.textContent.trim();
      autoResize();
      updateSend();
      input.focus();
    });
  });

  function setTheme(theme) {
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem('lmds.theme', theme); } catch (_) {}
  }
  let savedTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  try { savedTheme = localStorage.getItem('lmds.theme') || savedTheme; } catch (_) {}
  setTheme(savedTheme);
  $('#themeToggle').onclick = () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
  /* ===== 初始化 ===== */
  fetch('/api/config', { cache: 'no-store' })
    .then(res => { if (!res.ok) throw new Error('配置读取失败'); return res.json(); })
    .then(config => { document.documentElement.dataset.ttsEnabled = String(config.ttsEnabled === true); })
    .catch(() => { document.documentElement.dataset.ttsEnabled = 'false'; });
  renderConvList();
  const initParams = new URLSearchParams(location.search);
  if (initParams.get('think') === 'true') { think = true; thinkBtn.classList.add('active'); }
  if (initParams.get('search') === 'true') { search = true; searchBtn.classList.add('active'); }
  const qParam = initParams.get('q');
  if (qParam) sendQuestion(qParam.trim());
})();
</script>
</body>
</html>
